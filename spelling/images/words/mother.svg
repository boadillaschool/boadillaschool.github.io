  <title id="titulo">Una madre abraza a su hija</title>
  <desc id="descripcion">Madre: una madre se inclina hacia su hija y la rodea con ambos brazos. La niña apoya la cabeza junto a ella y le devuelve el abrazo; las dos tienen una expresión serena.</desc>
